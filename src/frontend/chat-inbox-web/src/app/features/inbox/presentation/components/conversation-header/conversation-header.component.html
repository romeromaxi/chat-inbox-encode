<header class="conversation-header">
  <span class="conversation-header__identity">
    <strong>{{ primaryName() }}</strong>
    @if (secondaryName(); as name) {
      <span>{{ name }}</span>
    }
  </span>
  <span class="conversation-header__actions">
    <span
      class="conversation-header__connection"
      [class.conversation-header__connection--connected]="connectionStatus() === 'connected'"
    >
      {{ connectionLabel() }}
    </span>
    <button type="button" aria-label="Close conversation" (click)="closeRequested.emit()">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path
          d="m6.7 5.3 5.3 5.3 5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z"
        />
      </svg>
    </button>
  </span>
</header>
