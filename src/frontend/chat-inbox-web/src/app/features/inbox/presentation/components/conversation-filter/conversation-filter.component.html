<div class="conversation-filter" role="group" aria-label="Conversation filters">
  <button
    type="button"
    [attr.aria-pressed]="store.activeFilter() === 'all'"
    (click)="selectFilter('all')"
  >
    Todos
  </button>
  <button
    type="button"
    [attr.aria-pressed]="store.activeFilter() === 'unread'"
    (click)="selectFilter('unread')"
  >
    No leídos
  </button>
</div>
