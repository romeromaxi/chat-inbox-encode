<form (submit)="send($event)">
  <label for="message-text">Reply</label>
  <div class="message-composer__controls">
    <textarea
      id="message-text"
      rows="2"
      placeholder="Escriba un mensaje"
      [formControl]="messageControl"
      [attr.maxlength]="maxMessageLength"
      [readOnly]="sending()"
      (input)="sendFailed.set(false)"
    ></textarea>
    <button type="submit" [disabled]="sending() || messageControl.invalid">
      {{ sending() ? 'Enviando…' : 'Enviar' }}
    </button>
  </div>
  <div class="message-composer__meta" aria-live="polite">
    @if (sendFailed()) {
      <span role="alert">El mensaje no pudo ser enviado. Intente nuevamente.</span>
    } @else {
      <span></span>
    }
    <span>{{ messageControl.value.length }} / {{ maxMessageLength }}</span>
  </div>
</form>
